<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 Programação — O Cara Testou</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #111; color: #fff; min-height: 100vh; }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #151515; border-bottom: 1px solid #242424;
    padding: .7rem 1rem; display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: start; -webkit-justify-content: flex-start; justify-content: flex-start;
    -webkit-box-orient: horizontal; -webkit-box-direction: normal;
    -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: .6rem;
  }
  .topbar h1 { font-size: 1rem; font-weight: 800; margin: 0; }
  .topbar .spacer { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }

  .btn {
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px;
    padding: .5rem .85rem; color: #fff; font-weight: 700; font-size: .75rem;
    cursor: pointer; display: -webkit-inline-box; display: -webkit-inline-flex; display: inline-flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    gap: .4rem; text-decoration: none; font-family: inherit;
  }
  .btn:active { background: #222; }
  .btn.back { padding-left: .6rem; }
  .btn:disabled { opacity: .5; }
  .btn.primary { background: #e63946; border-color: #e63946; }

  main { padding: .8rem 1rem 3rem; padding-top: 110px; max-width: 940px; margin: 0 auto; width: 100%; }

  .controls {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: .7rem;
    -webkit-box-align: end; -webkit-align-items: flex-end; align-items: flex-end;
    background: #151515; border: 1px solid #242424; border-radius: 14px;
    padding: .8rem 1rem; margin-bottom: 1rem;
  }
  .control-group {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-box-direction: normal;
    -webkit-flex-direction: column; flex-direction: column; gap: .3rem;
  }
  .control-group label { font-size: .65rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .06em; }
  .control-group select, .control-group input[type="date"],
  .control-group input[type="email"], .control-group input[type="password"] {
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
    padding: .4rem .6rem; color: #fff; font-size: .78rem; font-weight: 600; font-family: inherit;
  }
  .control-group input[type="date"] { width: 150px; }

  .density-banner {
    background: #1a1a2e; border: 1px solid #2a2a4a;
    border-radius: 12px; padding: .6rem .9rem; margin-bottom: .8rem;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: .6rem; font-size: .73rem;
  }
  .density-banner .badge {
    background: #e63946; color: #fff; font-size: .56rem; font-weight: 800;
    padding: .12rem .45rem; border-radius: 6px; text-transform: uppercase;
  }
  .density-banner b { color: #fff; }

  .modos {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: .4rem; -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  }
  .modo-btn {
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px;
    padding: .45rem .85rem; color: #888; font-weight: 700; font-size: .72rem;
    cursor: pointer; font-family: inherit;
  }
  .modo-btn:active, .modo-btn.ativo { background: #e63946; border-color: #e63946; color: #fff; }

  .cx-vazia { text-align: center; padding: 2rem .8rem; color: #555; }
  .cx-vazia .icon { font-size: 2rem; opacity: .35; margin-bottom: .5rem; }

  .day-card {
    background: #151515; border: 1px solid #242424; border-radius: 14px;
    margin-bottom: .8rem; overflow: hidden;
  }
  .day-header {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    padding: .7rem .9rem; background: #1a1a1a; border-bottom: 1px solid #242424; gap: .6rem;
    -webkit-flex-wrap: wrap; flex-wrap: wrap;
  }
  .day-title { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-box-direction: normal; -webkit-flex-direction: column; flex-direction: column; gap: .1rem; }
  .day-title .dow { font-size: .58rem; font-weight: 800; color: #e63946; text-transform: uppercase; letter-spacing: .07em; }
  .day-title .date { font-size: .88rem; font-weight: 700; }
  .today-badge {
    background: #e63946; color: #fff; font-size: .52rem; font-weight: 800;
    padding: .1rem .4rem; border-radius: 5px; text-transform: uppercase;
  }
  .day-stats {
    display: -webkit-box; display: -webkit-flex; display: flex; gap: .8rem;
    font-size: .68rem; color: #777;
  }
  .day-stats b { color: #fff; }

  .hours-grid {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: .6rem; padding: .75rem .9rem;
  }
  .hour-block {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-box-direction: normal;
    -webkit-flex-direction: column; flex-direction: column; gap: .35rem;
    width: 140px;
  }
  .hour-label { font-size: .64rem; font-weight: 800; color: #666; text-transform: uppercase; }
  .slot-row { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: .3rem; }
  .slot {
    position: relative; width: 36px; height: 36px; border-radius: 8px;
    background: #1a1a1a; border: 1px solid #2a2a2a;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    cursor: pointer;
  }
  .slot:active { border-color: #e63946; }
  .slot input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .slot .box {
    width: 18px; height: 18px; border: 2px solid #444; border-radius: 5px;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    color: transparent; font-size: .62rem; font-weight: 800;
  }
  .slot input:checked + .box { background: #2a7a2a; border-color: #2a7a2a; color: #fff; }
  .slot input:checked + .box::after { content: '\2713'; }

  .day-del { padding: .3rem .6rem; font-size: .68rem; border-color: #5a2a2a; }
  .day-del:active { background: #3a1d1d; }

  .analise-card { background: #151515; border: 1px solid #242424; border-radius: 14px; padding: .8rem .9rem; margin-bottom: .7rem; }
  .analise-top {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    gap: .6rem; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin-bottom: .5rem;
  }
  .analise-data { font-weight: 800; font-size: .85rem; }
  .analise-num { font-size: .7rem; color: #888; }
  .analise-num b { color: #fff; }
  .barra { height: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; overflow: hidden; }
  .barra > i { display: block; height: 100%; background: #2a7a2a; border-radius: 6px; }
  .analise-geral {
    background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px;
    padding: .7rem .9rem; margin-bottom: .8rem; font-size: .72rem;
    display: -webkit-box; display: -webkit-flex; display: flex;
    gap: 1rem; -webkit-flex-wrap: wrap; flex-wrap: wrap;
  }
  .analise-geral b { color: #fff; }

  .toast-bar {
    position: fixed; bottom: 1rem; left: 50%; z-index: 300;
    -webkit-transform: translateX(-50%) translateY(120%); transform: translateX(-50%) translateY(120%);
    background: #1d3a1d; border: 1px solid #2a5a2a; color: #9be69b;
    padding: .5rem .9rem; border-radius: 10px; font-size: .75rem; font-weight: 700;
  }
  .toast-bar.vis { -webkit-transform: translateX(-50%) translateY(0); transform: translateX(-50%) translateY(0); }

  .login-box { background: #151515; border: 1px solid #242424; border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }
  .login-box h2 { font-size: .95rem; font-weight: 800; margin: 0 0 .8rem; }
  .login-box .control-group { margin-bottom: .6rem; }
  .login-box input { width: 100%; max-width: 320px; }
  .login-err { color: #ff9b9b; font-size: .72rem; font-weight: 700; margin-top: .5rem; display: none; }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="btn back">Voltar</a>
  <h1>Programacao</h1>
  <div class="spacer"></div>
  <div class="modos">
    <button class="modo-btn" data-modo="passadas">Passadas</button>
    <button class="modo-btn ativo" data-modo="atuais">Programacao</button>
    <button class="modo-btn" data-modo="analise">Analise</button>
  </div>
</div>

<main>
  <div class="density-banner" id="banner">
    <span class="badge">Plano</span>
    <span id="bannerTxt">Carregando...</span>
  </div>

  <div class="login-box" id="loginBox" style="display:none">
    <h2>Entrar</h2>
    <div class="control-group">
      <label>E-mail</label>
      <input type="email" id="loginEmail" autocomplete="username">
    </div>
    <div class="control-group">
      <label>Senha</label>
      <input type="password" id="loginPass" autocomplete="current-password">
    </div>
    <button class="btn primary" id="btnLogin">Entrar</button>
    <div class="login-err" id="loginErr"></div>
  </div>

  <div class="controls" id="controlsBox" style="display:none">
    <div class="control-group">
      <label>Comecar em</label>
      <input type="date" id="startDate">
    </div>
    <div class="control-group">
      <label>Dias</label>
      <select id="dayCount">
        <option value="3">3</option>
        <option value="7" selected>7</option>
        <option value="14">14</option>
        <option value="30">30</option>
      </select>
    </div>
    <div class="control-group">
      <label>Posts por hora</label>
      <select id="slotsPerHour">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </div>
    <button class="btn" id="btnGerar">Gerar dias</button>
  </div>

  <div id="dias"></div>
</main>

<div class="toast-bar" id="toast"></div>

<script src="config.js"></script>
<script>
(function() {
  var SUPABASE_URL = (window.SUPABASE_URL || '').trim();
  var SUPABASE_ANON_KEY = (window.SUPABASE_ANON_KEY || '').trim();

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    document.getElementById('bannerTxt').textContent = 'Configuracao ausente — verifique o config.js';
    return;
  }

  var TOKEN_KEY = 'oct_ipad_token';
  var USER_KEY = 'oct_ipad_user';
  var HORAS = [];
  for (var _h = 0; _h < 24; _h++) { HORAS.push(_h); }
  var diasSemana = ['Domingo','Segunda','Terca','Quarta','Quinta','Sexta','Sabado'];
  var meses = ['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var slots = {};
  var modo = 'atuais';
  var token = null;
  var userId = null;

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function chaveDia(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseChave(c) { var p = c.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function hoje() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function compostarMeta() { var v = parseInt($('slotsPerHour').value, 10) * 24; return 'Meta: <b>' + v + '</b> posts/dia · ' + $('slotsPerHour').value + ' por hora x 24h (0h-23h)'; }

  var _toastTimer;
  function fmtToast(msg, erro) {
    var t = $('toast');
    t.style.background = erro ? '#3a1d1d' : '#1d3a1d';
    t.style.borderColor = erro ? '#5a2a2a' : '#2a5a2a';
    t.style.color = erro ? '#ff9b9b' : '#9be69b';
    t.textContent = msg;
    t.className = 'toast-bar vis';
    if (_toastTimer) { try { clearTimeout(_toastTimer); } catch (e) {} }
    _toastTimer = setTimeout(function() { t.className = 'toast-bar'; }, 2600);
  }

  function xhr(method, path, body, cb) {
    var x = new XMLHttpRequest();
    x.open(method, SUPABASE_URL + path, true);
    x.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    x.setRequestHeader('Content-Type', 'application/json');
    if (token) { x.setRequestHeader('Authorization', 'Bearer ' + token); }
    x.onreadystatechange = function() {
      if (x.readyState !== 4) { return; }
      var data = null;
      try { data = x.responseText ? JSON.parse(x.responseText) : null; } catch (e) { data = null; }
      if (x.status >= 200 && x.status < 300) { cb(null, data); }
      else {
        var msg = 'HTTP ' + x.status;
        if (data && data.msg) { msg = data.msg; }
        else if (data && data.message) { msg = data.message; }
        else if (data && data.error_description) { msg = data.error_description; }
        cb(new Error(msg), data);
      }
    };
    x.onerror = function() { cb(new Error('Falha de rede')); };
    x.send(body ? JSON.stringify(body) : null);
  }

  function checarSessao(cb) {
    try { token = window.localStorage.getItem(TOKEN_KEY) || null; } catch (e) { token = null; }
    try { userId = window.localStorage.getItem(USER_KEY) || null; } catch (e) { userId = null; }
    if (!token) { cb(null); return; }
    xhr('GET', '/auth/v1/user', null, function(err, u) {
      if (err) {
        token = null; userId = null;
        try { window.localStorage.removeItem(TOKEN_KEY); window.localStorage.removeItem(USER_KEY); } catch (e2) {}
        cb(null); return;
      }
      if (u && u.id) { userId = u.id; }
      cb(u);
    });
  }

  function fazerLogin() {
    var email = ($('loginEmail').value || '').trim();
    var pass = $('loginPass').value || '';
    var errBox = $('loginErr');
    errBox.style.display = 'none';
    if (!email || !pass) { errBox.textContent = 'Informe e-mail e senha.'; errBox.style.display = 'block'; return; }
    var btn = $('btnLogin');
    btn.disabled = true;
    xhr('POST', '/auth/v1/token?grant_type=password', { email: email, password: pass }, function(err, res) {
      btn.disabled = false;
      if (err || !res || !res.access_token) {
        var m = 'Login falhou.';
        if (res && res.error_description) { m = res.error_description; }
        else if (res && res.msg) { m = res.msg; }
        else if (err && err.message) { m = 'Login falhou: ' + err.message; }
        errBox.textContent = m; errBox.style.display = 'block';
        return;
      }
      token = res.access_token;
      userId = (res.user && res.user.id) ? res.user.id : null;
      try {
        window.localStorage.setItem(TOKEN_KEY, token);
        if (userId) { window.localStorage.setItem(USER_KEY, userId); }
      } catch (e) {}
      mostrarApp();
      fmtToast('Login OK. Carregando dias...');
      carregar();
    });
  }

  function mostrarLogin() {
    $('loginBox').style.display = 'block';
    $('controlsBox').style.display = 'none';
    $('bannerTxt').textContent = 'Faca login para ver sua programacao.';
  }

  function mostrarApp() {
    $('loginBox').style.display = 'none';
    $('controlsBox').style.display = 'block';
    $('bannerTxt').innerHTML = compostarMeta();
  }

  function slotHTML(s) {
    return '<label class="slot"><input type="checkbox" data-chave="' + s.chaveDia + '|' + s.hora + '|' + s.idx + '"' + (s.ativo ? ' checked' : '') + '><span class="box"></span></label>';
  }

  function gerar() {
    if (!token || !userId) { mostrarLogin(); fmtToast('Faca login primeiro.', true); return; }
    var start = $('startDate').value;
    if (!start) { fmtToast('Escolha a data inicial.', true); return; }
    var inicio = parseChave(start);
    var qtd = parseInt($('dayCount').value, 10);
    var porHora = parseInt($('slotsPerHour').value, 10);
    var btn = $('btnGerar');
    btn.disabled = true;

    var linhas = [];
    for (var i = 0; i < qtd; i++) {
      var d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i);
      var cj = chaveDia(d);
      for (var hi = 0; hi < HORAS.length; hi++) {
        for (var s = 0; s < porHora; s++) {
          linhas.push({ user_id: userId, schedule_date: cj, hour: HORAS[hi], slot_index: s, ativo: false, status: 'agendado' });
        }
      }
    }
    if (!linhas.length) { btn.disabled = false; fmtToast('Nada para gerar.', true); return; }

    var x = new XMLHttpRequest();
    x.open('POST', SUPABASE_URL + '/rest/v1/post_schedule', true);
    x.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    x.setRequestHeader('Authorization', 'Bearer ' + token);
    x.setRequestHeader('Content-Type', 'application/json');
    x.setRequestHeader('Prefer', 'resolution=ignore-duplicates,return=minimal');
    x.onreadystatechange = function() {
      if (x.readyState !== 4) { return; }
      btn.disabled = false;
      if (x.status >= 200 && x.status < 300) {
        fmtToast('Dias enviados ao banco. Recarregando...');
        carregar();
      } else {
        fmtToast('Erro ao gerar: HTTP ' + x.status, true);
      }
    };
    x.onerror = function() { btn.disabled = false; fmtToast('Falha de rede ao gerar.', true); };
    x.send(JSON.stringify(linhas));
  }

  function slotKeys() {
    var out = [];
    for (var k in slots) { if (slots.hasOwnProperty(k)) { out.push(k); } }
    return out;
  }

  function slotVals() {
    var out = [];
    var ks = slotKeys();
    for (var i = 0; i < ks.length; i++) { out.push(slots[ks[i]]); }
    return out;
  }

  function desenhar() {
    var container = $('dias');
    var keys = slotKeys();
    var diaSet = {};
    for (var i = 0; i < keys.length; i++) { diaSet[keys[i].split('|')[0]] = 1; }
    var todas = [];
    for (var cj0 in diaSet) { if (diaSet.hasOwnProperty(cj0)) { todas.push(cj0); } }
    todas.sort();
    var diaAtual = chaveDia(hoje());

    if (modo === 'analise') { desenharAnalise(container, todas); return; }
    var dias = [];
    for (var di = 0; di < todas.length; di++) {
      var cjF = todas[di];
      if (modo === 'passadas' ? cjF < diaAtual : cjF >= diaAtual) { dias.push(cjF); }
    }

    if (!dias.length) {
      container.innerHTML = '<div class="cx-vazia"><div class="icon">.</div>' + (modo === 'passadas' ? 'Nenhuma data passada no banco.' : 'Nenhum dia a partir de hoje. Configure e clique em "Gerar dias".') + '</div>';
      return;
    }

    var html = '';
    for (var gi = 0; gi < dias.length; gi++) {
      var cj = dias[gi];
      var d = parseChave(cj);
      var ehHoje = cj === diaAtual;
      var passado = cj < diaAtual;
      var vals = [];
      for (var vi = 0; vi < keys.length; vi++) {
        if (keys[vi].indexOf(cj + '|') === 0) { vals.push(slots[keys[vi]]); }
      }
      var total = vals.length;
      var agendados = 0;
      for (var ai = 0; ai < vals.length; ai++) { if (vals[ai].ativo) { agendados++; } }

      var horasHTML = '';
      for (var hlo = 0; hlo < HORAS.length; hlo++) {
        var h = HORAS[hlo];
        var ss = [];
        for (var si = 0; si < vals.length; si++) { if (vals[si].hora === h) { ss.push(vals[si]); } }
        horasHTML += '<div class="hour-block"><div class="hour-label">' + pad(h) + 'h</div><div class="slot-row">';
        for (var sj = 0; sj < ss.length; sj++) { horasHTML += slotHTML(ss[sj]); }
        horasHTML += '</div></div>';
      }

      html += '<div class="day-card">';
      html += '<div class="day-header">';
      html += '<div class="day-title">';
      html += '<div class="dow">' + diasSemana[d.getDay()] + '</div>';
      html += '<div class="date">' + d.getDate() + ' de ' + meses[d.getMonth()];
      if (ehHoje) html += ' <span class="today-badge">hoje</span>';
      if (passado) html += ' <span class="today-badge" style="background:#444">passado</span>';
      html += '</div></div>';
      html += '<div class="day-stats"><span>Meta <b>' + total + '</b></span><span>Agendado <b data-agendado>' + agendados + '</b></span></div>';
      html += '<button class="btn day-del" data-excluir-dia="' + cj + '">Excluir</button>';
      html += '</div>';
      html += '<div class="hours-grid">' + horasHTML + '</div>';
      html += '</div>';
    }

    container.innerHTML = html;
    vincularSlots();
    $('bannerTxt').innerHTML = compostarMeta();
  }

  function desenharAnalise(container, dias) {
    if (!dias.length) {
      container.innerHTML = '<div class="cx-vazia"><div class="icon">.</div>Nenhum dado no banco ainda.</div>';
      return;
    }
    var tMeta = 0, tAg = 0;
    var cards = '';
    for (var i = 0; i < dias.length; i++) {
      var cj = dias[i];
      var vals = slotVals();
      var meta = 0, ag = 0;
      for (var vi = 0; vi < vals.length; vi++) {
        if (vals[vi].chaveDia === cj) { meta++; if (vals[vi].ativo) { ag++; } }
      }
      tMeta += meta; tAg += ag;
      var pct = meta ? Math.round(ag * 100 / meta) : 0;
      var d = parseChave(cj);
      cards += '<div class="analise-card"><div class="analise-top"><span class="analise-data">' + diasSemana[d.getDay()] + ', ' + d.getDate() + ' de ' + meses[d.getMonth()] + '</span>';
      cards += '<span class="analise-num">Meta <b>' + meta + '</b> · Agendados <b>' + ag + '</b> · <b>' + pct + '%</b></span></div>';
      cards += '<div class="barra"><i style="width:' + pct + '%"></i></div></div>';
    }
    var pctG = tMeta ? Math.round(tAg * 100 / tMeta) : 0;
    container.innerHTML = '<div class="analise-geral"><span>Dias <b>' + dias.length + '</b></span><span>Meta total <b>' + tMeta + '</b></span><span>Agendados <b>' + tAg + '</b></span><span>Concluido <b>' + pctG + '%</b></span></div>' + cards;
  }

  function salvarSlot(s, inp) {
    var x = new XMLHttpRequest();
    x.open('POST', SUPABASE_URL + '/rest/v1/post_schedule', true);
    x.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    x.setRequestHeader('Authorization', 'Bearer ' + token);
    x.setRequestHeader('Content-Type', 'application/json');
    x.setRequestHeader('Prefer', 'resolution=merge-duplicates,return=minimal');
    x.onreadystatechange = function() {
      if (x.readyState !== 4) { return; }
      if (x.status < 200 || x.status >= 300) {
        s.ativo = !inp.checked;
        inp.checked = s.ativo;
        fmtToast('Erro ao salvar: HTTP ' + x.status, true);
      }
    };
    x.onerror = function() {
      s.ativo = !inp.checked;
      inp.checked = s.ativo;
      fmtToast('Falha de rede ao salvar.', true);
    };
    x.send(JSON.stringify({ user_id: userId, schedule_date: s.chaveDia, hour: s.hora, slot_index: s.idx, ativo: s.ativo, status: 'agendado' }));
  }

  function vincularSlots() {
    var inputs = document.querySelectorAll('.slot input');
    for (var i = 0; i < inputs.length; i++) {
      (function(inp) {
        inp.addEventListener('change', function() {
          var parts = inp.getAttribute('data-chave').split('|');
          var cj = parts[0], h = +parts[1], idx = +parts[2];
          var k = cj + '|' + h + '|' + idx;
          var s = slots[k];
          if (!s) return;
          s.ativo = inp.checked;
          var card = inp.parentNode;
          while (card && (!card.className || card.className.indexOf('day-card') < 0)) { card = card.parentNode; }
          var agEl = card ? card.querySelector('[data-agendado]') : null;
          if (agEl) {
            var c = 0;
            var ks = slotKeys();
            for (var qi = 0; qi < ks.length; qi++) {
              var v = slots[ks[qi]];
              if (v.chaveDia === cj && v.ativo) { c++; }
            }
            agEl.textContent = c;
          }
          salvarSlot(s, inp);
        });
      })(inputs[i]);
    }

    var dels = document.querySelectorAll('[data-excluir-dia]');
    for (var j = 0; j < dels.length; j++) {
      (function(btn) {
        btn.addEventListener('click', function() { excluirDia(btn.getAttribute('data-excluir-dia')); });
      })(dels[j]);
    }
  }

  function excluirDia(cj) {
    if (!confirm('Excluir o dia ' + cj + '?')) return;
    if (!token || !userId) { mostrarLogin(); return; }
    var x = new XMLHttpRequest();
    x.open('DELETE', SUPABASE_URL + '/rest/v1/post_schedule?user_id=eq.' + encodeURIComponent(userId) + '&schedule_date=eq.' + encodeURIComponent(cj), true);
    x.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    x.setRequestHeader('Authorization', 'Bearer ' + token);
    x.setRequestHeader('Prefer', 'return=minimal');
    x.onreadystatechange = function() {
      if (x.readyState !== 4) { return; }
      if (x.status >= 200 && x.status < 300) {
        fmtToast('Dia ' + cj + ' excluido.');
        carregar();
      } else {
        fmtToast('Erro ao excluir: HTTP ' + x.status, true);
      }
    };
    x.onerror = function() { fmtToast('Falha de rede ao excluir.', true); };
    x.send(null);
  }

  function carregar() {
    if (!token || !userId) { mostrarLogin(); return; }
    var q = '/rest/v1/post_schedule?select=schedule_date,hour,slot_index,ativo&user_id=eq.' + encodeURIComponent(userId) + '&order=schedule_date.asc&order=hour.asc&order=slot_index.asc';
    xhr('GET', q, null, function(err, rows) {
      if (err) {
        fmtToast('Erro ao carregar: ' + err.message, true);
        return;
      }
      slots = {};
      if (rows) {
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          var k = r.schedule_date + '|' + r.hour + '|' + r.slot_index;
          slots[k] = { chaveDia: r.schedule_date, hora: r.hour, idx: r.slot_index, ativo: r.ativo !== false };
        }
      }
      desenhar();
    });
  }

  $('btnGerar').addEventListener('click', function() { gerar(); });
  $('btnLogin').addEventListener('click', function() { fazerLogin(); });

  var modoBtns = document.querySelectorAll('[data-modo]');
  for (var m = 0; m < modoBtns.length; m++) {
    (function(b) {
      b.addEventListener('click', function() {
        modo = b.getAttribute('data-modo');
        for (var x = 0; x < modoBtns.length; x++) {
          modoBtns[x].className = modoBtns[x] === b ? 'modo-btn ativo' : 'modo-btn';
        }
        desenhar();
      });
    })(modoBtns[m]);
  }

  $('slotsPerHour').addEventListener('change', function() { $('bannerTxt').innerHTML = compostarMeta(); });

  if (!$('startDate').value) {
    var t = new Date();
    $('startDate').value = chaveDia(t);
  }

  checarSessao(function(u) {
    if (u && userId) { mostrarApp(); carregar(); }
    else { slots = {}; desenharVazio(); mostrarLogin(); }
  });

  function desenharVazio() {
    $('dias').innerHTML = '<div class="cx-vazia"><div class="icon">.</div>Faca login para ver sua programacao.</div>';
  }
})();
</script>
</body>
