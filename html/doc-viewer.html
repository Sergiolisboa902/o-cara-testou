<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documento &mdash; O Cara Testou</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #f9f9f9; color: #1a1a1a; padding-top: 3.5rem; }
  .topnav {
    position: fixed; top: 0; left: 0; right: 0;
    background: #1a1a1a; padding: .6rem 2rem; z-index: 150;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topnav-brand { font-weight: 800; color: #fff; font-size: .9rem; }
  .topnav-brand span { color: #e63946; }
  .topnav-brand a { color: inherit; text-decoration: none; }
  .topnav-brand a:hover { opacity: .8; }
  .topnav-back {
    background: #333; border: none; padding: .4rem .9rem;
    font-size: .78rem; font-weight: 600; font-family: inherit;
    color: #ccc; cursor: pointer; border-radius: 6px; text-decoration: none;
    transition: all .2s;
  }
  .topnav-back:hover { background: #e63946; color: #fff; }

  .container { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem; }
  .doc-content {
    background: #fff; border-radius: 14px; padding: 1.5rem 2rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); line-height: 1.7;
    font-size: .92rem;
  }
  .doc-content h1 { font-size: 1.5rem; margin-bottom: .8rem; }
  .doc-content h2 { font-size: 1.15rem; margin-top: 1.5rem; margin-bottom: .5rem; }
  .doc-content h3 { font-size: 1rem; margin-top: 1.2rem; margin-bottom: .3rem; }
  .doc-content p { margin-bottom: .6rem; color: #333; }
  .doc-content ul, .doc-content ol { padding-left: 1.5rem; margin-bottom: .6rem; }
  .doc-content li { margin-bottom: .2rem; }
  .doc-content table { width: 100%; border-collapse: collapse; margin: .8rem 0; font-size: .82rem; }
  .doc-content th, .doc-content td { border: 1px solid #ddd; padding: .4rem .7rem; text-align: left; }
  .doc-content th { background: #f5f5f5; font-weight: 700; }
  .doc-content code { background: #f0f0f0; padding: .15rem .4rem; border-radius: 4px; font-size: .82rem; }
  .doc-content pre { background: #f0f0f0; padding: 1rem; border-radius: 8px; overflow-x: auto; margin: .6rem 0; }
  .doc-content pre code { background: none; padding: 0; }
  .doc-content blockquote { border-left: 3px solid #e63946; padding-left: 1rem; margin: .6rem 0; color: #666; }
  .doc-content a { color: #e63946; }
  .doc-content img { max-width: 100%; border-radius: 8px; margin: .6rem 0; }

  .doc-loading { text-align: center; padding: 3rem; color: #999; font-size: .9rem; }
  .doc-error { text-align: center; padding: 3rem; color: #e63946; }

  @media (max-width: 600px) {
    .container { padding: 1rem; }
    .doc-content { padding: 1rem 1.2rem; }
  }
</style>
</head>
<body>
<div class="topnav">
  <div class="topnav-brand"><a href="index.html"><span>O</span> Cara Testou</a></div>
  <a href="index.html" class="topnav-back">&larr; Voltar</a>
</div>
<div class="container">
  <div class="doc-content" id="content">
    <div class="doc-loading">Carregando...</div>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search)
const path = params.get('path')
if (!path) { document.getElementById('content').innerHTML = '<div class="doc-error">Nenhum documento especificado.</div>' }
else {
  fetch(path).then(r => {
    if (!r.ok) throw new Error('Not found')
    return r.text()
  }).then(md => {
    document.title = document.title.replace('Documento', path.split('/').pop().replace('.md',''))
    document.getElementById('content').innerHTML = marked.parse(md)
  }).catch(() => {
    document.getElementById('content').innerHTML = '<div class="doc-error">Erro ao carregar o documento.</div>'
  })
}
</script>
</body>
</html>
