<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar Roteiro — O Cara Testou</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #f9f9f9; color: #1a1a1a; }
  .topnav {
    background: #1a1a1a; padding: .6rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topnav-brand { font-weight: 800; color: #fff; font-size: .9rem; }
  .topnav-brand span { color: #e63946; }
  .topnav-brand a { color: inherit; text-decoration: none; }
  .topnav-back {
    background: #333; border: none; padding: .4rem .9rem;
    font-size: .78rem; font-weight: 600; font-family: inherit;
    color: #ccc; cursor: pointer; border-radius: 6px; text-decoration: none;
    transition: all .2s;
  }
  .topnav-back:hover { background: #e63946; color: #fff; }
  .container { max-width: 720px; margin: 0 auto; padding: 1.5rem; }

  .card {
    background: #fff; border-radius: 14px; padding: 1.2rem 1.5rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 1rem;
  }
  .card-title {
    font-size: .9rem; font-weight: 800; margin-bottom: .8rem;
    padding-bottom: .4rem; border-bottom: 2px solid #e63946;
    text-transform: uppercase; letter-spacing: .04em;
  }

  select, button {
    font-family: inherit; font-size: .85rem; padding: .5rem .7rem;
    border-radius: 8px; border: 1px solid #ddd; background: #fff; width: 100%; color: #1a1a1a;
  }
  .btn-row { display: flex; gap: .6rem; margin-top: .2rem; }
  button.primary { background: #e63946; color: #fff; font-weight: 700; cursor: pointer; border: none; transition: all .2s; }
  button.primary:hover { background: #c82d3a; }
  button.ghost { background: #eee !important; color: #1a1a1a !important; cursor: pointer; }
  button.ghost:hover { background: #ddd !important; }

  .minibox {
    background: #f5f5f5; border: 1px solid #eee; border-radius: 8px;
    padding: .55rem .8rem; font-size: .82rem; color: #333; margin-top: .3rem;
    cursor: pointer; transition: all .15s;
  }
  .minibox:hover { border-color: #e63946; background: #fff; }
  .minibox.sel { border-color: #e63946; background: #fff3f3; font-weight: 700; }
  .cat-btns { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .3rem; }
  .cat-btn {
    background: #eee; border: 1px solid #ddd; border-radius: 6px;
    padding: .3rem .6rem; font-size: .72rem; font-weight: 700; color: #444;
    cursor: pointer; transition: all .15s; width: auto;
  }
  .cat-btn:hover { background: #ddd; }
  .cat-btn.sel { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  .roteiro {
    background: #fff; border-radius: 14px; padding: 1.2rem 1.5rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 1rem;
  }
  .roteiro-item {
    display: flex; gap: .6rem; padding: .4rem 0;
    border-bottom: 1px solid #f0f0f0; font-size: .85rem; line-height: 1.5;
  }
  .roteiro-item:last-child { border-bottom: none; }
  .roteiro-ico { flex-shrink: 0; }
  .roteiro-label { font-weight: 700; color: #e63946; min-width: 105px; }
  .hidden { display: none; }
  .footer { text-align: center; padding: 1.5rem; font-size: .72rem; color: #999; }

  .roteiro-card {
    background: #fff; border-radius: 12px; padding: .9rem 1.2rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: .8rem;
    border: 1px solid #eee;
  }
  .rc-head { display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; }
  .rc-title { font-size: .82rem; font-weight: 800; }
  .rc-title span { color: #e63946; }
  .rc-time { font-size: .7rem; color: #999; }
  .rc-tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
  .rc-tag {
    background: #f0f0f0; border-radius: 5px; padding: .15rem .5rem;
    font-size: .7rem; font-weight: 600; color: #444;
  }
  .rc-tag.ang { background: #1a1a1a; color: #fff; }
  .rc-actions { display: flex; gap: .4rem; margin-top: .6rem; }
  .rc-btn {
    background: #eee; border: none; border-radius: 6px;
    padding: .3rem .7rem; font-size: .72rem; font-weight: 700; color: #333;
    cursor: pointer; transition: all .15s;
  }
  .rc-btn:hover { background: #ddd; }
  .rc-btn.del { color: #e63946; }
  .rc-btn.del:hover { background: #ffe3e3; }
  .rc-full { display: none; margin-top: .7rem; padding-top: .7rem; border-top: 1px dashed #ddd; }
  .rc-full.open { display: block; }
  .rc-full .roteiro-item { font-size: .8rem; }
  .vazio { text-align: center; padding: 2rem; color: #aaa; font-size: .82rem; }
  .clear-all { text-align: right; margin-bottom: .6rem; }
</style>
</head>
<body>
<div class="topnav">
  <div class="topnav-brand"><a href="index.html"><span>O</span> Cara Testou</a></div>
  <a href="catalogo.html" class="topnav-back">&larr; Catálogo</a>
</div>
<div class="container" id="app"></div>
<div class="footer">O Cara Testou &mdash; Criar Roteiro</div>

<script src="dados-produtos.js"></script>
<script>
const app = document.getElementById('app')
const ids = Object.keys(produtosDB)
const estado = { produto: ids[0], angCat: null, angItem: null, ganCat: null, ganItem: null, tema: null }

function render() {
  const p = produtosDB[estado.produto]
  const angCats = [...new Set(p.angulos.map(a => a[0]))]
  const ganCats = [...new Set(p.ganchos.map(a => a[0]))]

  app.innerHTML = `
    <div class="card">
      <div class="card-title">Produto</div>
      <select id="sel-produto">
        ${ids.map(id => `<option value="${id}" ${id===estado.produto?'selected':''}>${produtosDB[id].nome}</option>`).join('')}
      </select>
    </div>

    <div class="card">
      <div class="card-title">Ângulo</div>
      <div class="cat-btns">${angCats.map(c => `<button class="cat-btn ${estado.angCat===c?'sel':''}" onclick="selAngCat('${c}')">${c}</button>`).join('')}</div>
      <div id="ang-list"></div>
    </div>

    <div class="card">
      <div class="card-title">Gancho</div>
      <div class="cat-btns">${ganCats.map(c => `<button class="cat-btn ${estado.ganCat===c?'sel':''}" onclick="selGanCat('${c}')">${c}</button>`).join('')}</div>
      <div id="gan-list"></div>
    </div>

    <div class="card">
      <div class="card-title">Tema</div>
      <div id="tema-list">
        ${p.temas.map((t,i) => `<div class="minibox ${estado.tema===t?'sel':''}" onclick="selTema(${i})">${t}</div>`).join('')}
      </div>
    </div>

    <div class="btn-row">
      <button class="primary" onclick="gerar()">✨ Gerar Roteiro</button>
      <button class="ghost" onclick="sortear()">🎲 Sortear</button>
    </div>

    <div id="area-roteiro" class="hidden" style="margin-top:1rem;"></div>

    <div class="card" style="margin-top:1.5rem;">
      <div class="card-title">📋 Roteiros Criados <span id="contador"></span></div>
      <div class="clear-all"><button class="rc-btn del" onclick="limparTodos()">🗑 Limpar todos</button></div>
      <div id="lista-roteiros"></div>
    </div>
  `

  document.getElementById('sel-produto').addEventListener('change', e => {
    estado.produto = e.target.value
    estado.angCat = estado.angItem = estado.ganCat = estado.ganItem = estado.tema = null
    render()
  })
  renderAngItens()
  renderGanItens()
  renderLista()
}

const LS_KEY = 'roteiros_criados'
function carregar() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || [] } catch(e) { return [] } }
function salvar(lista) { localStorage.setItem(LS_KEY, JSON.stringify(lista)) }

function renderLista() {
  const lista = carregar()
  const el = document.getElementById('lista-roteiros')
  document.getElementById('contador').textContent = `(${lista.length})`
  if (!lista.length) { el.innerHTML = '<div class="vazio">Nenhum roteiro criado ainda. Gere um acima.</div>'; return }
  el.innerHTML = lista.map(r => `
    <div class="roteiro-card">
      <div class="rc-head">
        <div class="rc-title"><span>${r.produtoNome}</span></div>
        <div class="rc-time">${new Date(r.ts).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })}</div>
      </div>
      <div class="rc-tags">
        <span class="rc-tag ang">🎯 ${r.angulo}</span>
        <span class="rc-tag">🎣 ${r.gancho}</span>
        <span class="rc-tag">👤 ${r.tema}</span>
      </div>
      <div class="rc-full" id="full-${r.id}">${r.html}</div>
      <div class="rc-actions">
        <button class="rc-btn" onclick="expandir('${r.id}')">👁 Ver roteiro</button>
        <button class="rc-btn" onclick="copiarSalvo('${r.id}')">📋 Copiar</button>
        <button class="rc-btn del" onclick="remover('${r.id}')">🗑 Excluir</button>
      </div>
    </div>`).join('')
}

function salvarRoteiro() {
  const p = produtosDB[estado.produto]
  const lista = carregar()
  const r = {
    id: Date.now().toString(36),
    produtoNome: p.nome,
    angulo: estado.angItem,
    gancho: estado.ganItem,
    tema: estado.tema,
    ts: Date.now(),
    html: montarLista()
  }
  lista.unshift(r)
  salvar(lista)
  renderLista()
}

function expandir(id) {
  const full = document.getElementById('full-' + id)
  full.classList.toggle('open')
}
function remover(id) {
  salvar(carregar().filter(r => r.id !== id))
  renderLista()
}
function limparTodos() {
  if (confirm('Excluir todos os roteiros?')) { salvar([]); renderLista() }
}
function textoSalvo(id) {
  const r = carregar().find(x => x.id === id)
  return `ROTEIRO — ${r.produtoNome}\nÂngulo: ${r.angulo}\nGancho: ${r.gancho}\nTema: ${r.tema}\n\n` + r.html.replace(/<[^>]*>/g, '').replace(/\n{3,}/g, '\n\n').trim()
}
function copiarSalvo(id) {
  navigator.clipboard.writeText(textoSalvo(id)).then(() => alert('Roteiro copiado!'))
}

function renderAngItens() {
  const p = produtosDB[estado.produto]
  if (!estado.angCat) { document.getElementById('ang-list').innerHTML = ''; return }
  const itens = p.angulos.filter(a => a[0] === estado.angCat)
  document.getElementById('ang-list').innerHTML = itens.map((a,i) =>
    `<div class="minibox ${estado.angItem===a[1]?'sel':''}" onclick="selAngItem(${i})">${a[1]}</div>`).join('')
}
function renderGanItens() {
  const p = produtosDB[estado.produto]
  if (!estado.ganCat) { document.getElementById('gan-list').innerHTML = ''; return }
  const itens = p.ganchos.filter(a => a[0] === estado.ganCat)
  document.getElementById('gan-list').innerHTML = itens.map((a,i) =>
    `<div class="minibox ${estado.ganItem===a[1]?'sel':''}" onclick="selGanItem(${i})">${a[1]}</div>`).join('')
}

function selAngCat(c) { estado.angCat = c; estado.angItem = null; render() }
function selGanCat(c) { estado.ganCat = c; estado.ganItem = null; render() }
function selAngItem(i) {
  const p = produtosDB[estado.produto]
  estado.angItem = p.angulos.filter(a => a[0] === estado.angCat)[i][1]
  render()
}
function selGanItem(i) {
  const p = produtosDB[estado.produto]
  estado.ganItem = p.ganchos.filter(a => a[0] === estado.ganCat)[i][1]
  render()
}
function selTema(i) {
  const p = produtosDB[estado.produto]
  estado.tema = p.temas[i]
  render()
}

function aleatorio(arr) { return arr[Math.floor(Math.random() * arr.length)] }
function escolherAleatorio() {
  const p = produtosDB[estado.produto]
  const ang = aleatorio(p.angulos)
  const gan = aleatorio(p.ganchos)
  estado.angCat = ang[0]; estado.angItem = ang[1]
  estado.ganCat = gan[0]; estado.ganItem = gan[1]
  estado.tema = aleatorio(p.temas)
}

function sortear() {
  escolherAleatorio()
  render()
  gerar()
}

function montarLista() {
  const p = produtosDB[estado.produto]
  const demo = p.info.demonstracao[0]
  const itens = [
    ['🎯','Ângulo', estado.angItem],
    ['🎣','Gancho', estado.ganItem],
    ['👤','Tema', estado.tema],
    ['🔧','Produto', p.info.solucao],
    ['🎬','Demo', demo + '. ' + p.info.demonstracaoFrase],
    ['🤯','Wow', p.info.momWow],
    ['✨','Transform', p.info.transformacao],
    ['✅','Veredito', p.info.veredito],
    ['🎯','CTA', 'O produto está no TikTok Shop. Confere o cupom e me conta o que achou.']
  ]
  return itens.map(([ico,label,txt]) => `
    <div class="roteiro-item">
      <span class="roteiro-ico">${ico}</span>
      <span class="roteiro-label">${label}</span>
      <span>${txt}</span>
    </div>`).join('')
}

function gerar() {
  const falhas = []
  if (!estado.angItem) falhas.push('Ângulo')
  if (!estado.ganItem) falhas.push('Gancho')
  if (!estado.tema) falhas.push('Tema')
  if (falhas.length) { alert('Falta escolher: ' + falhas.join(', ')); return }

  document.getElementById('area-roteiro').innerHTML = `
    <div class="roteiro">${montarLista()}</div>
    <div class="btn-row">
      <button class="primary" onclick="copiar()">📋 Copiar</button>
      <button class="ghost" onclick="baixar()">⬇ .txt</button>
    </div>
  `
  document.getElementById('area-roteiro').classList.remove('hidden')
  document.getElementById('area-roteiro').scrollIntoView({ behavior: 'smooth' })
  salvarRoteiro()
}

function textoRoteiro() {
  const p = produtosDB[estado.produto]
  const demo = p.info.demonstracao[0]
  return `ROTEIRO — ${p.nome}
Ângulo: ${estado.angItem}
Gancho: ${estado.ganItem}
Tema: ${estado.tema}
Produto: ${p.info.solucao}
Demo: ${demo}. ${p.info.demonstracaoFrase}
Wow: ${p.info.momWow}
Transformação: ${p.info.transformacao}
Veredito: ${p.info.veredito}
CTA: O produto está no TikTok Shop. Confere o cupom e me conta o que achou.`
}

function copiar() {
  navigator.clipboard.writeText(textoRoteiro()).then(() => alert('Roteiro copiado!'))
}
function baixar() {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([textoRoteiro()], { type: 'text/plain' }))
  a.download = 'roteiro.txt'
  a.click()
}

render()
</script>
</body>
</html>
