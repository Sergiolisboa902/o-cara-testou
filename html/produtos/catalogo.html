<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo de Produtos | O CARA TESTOU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;900&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--preto:#111111;--preto-claro:#1a1a1a;--preto-medio:#222222;--amarelo:#FFC20E;--cinza:#8C8C8C;--vermelho:#E63946;--branco:#FFFFFF}
        body{font-family:'Inter',sans-serif;background:var(--preto);color:var(--branco);line-height:1.6}
        body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:0.5}
        ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--preto)}::-webkit-scrollbar-thumb{background:#333;border-radius:100px}
        .topbar{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,#0a0a0a 0%,var(--preto) 100%);border-bottom:2px solid var(--amarelo);padding:0.75rem 1.5rem;display:flex;align-items:center;gap:1rem}
        .topbar .back{display:inline-flex;align-items:center;gap:0.4rem;background:var(--preto-medio);border:1px solid #333;border-radius:100px;padding:0.4rem 1rem;color:var(--cinza);text-decoration:none;font-size:0.8rem;font-weight:600;transition:all 0.3s}
        .topbar .back:hover{border-color:var(--amarelo);color:var(--amarelo)}
        .topbar .badge{font-family:'Anton',sans-serif;font-size:0.7rem;letter-spacing:1px;text-transform:uppercase;background:var(--amarelo);color:var(--preto);padding:0.25rem 0.5rem;border-radius:4px;margin-left:auto}
        .container{max-width:1100px;margin:0 auto;padding:2rem 1.5rem 4rem}
        .page-title{font-family:'Anton',sans-serif;font-size:2rem;text-transform:uppercase;color:var(--amarelo);letter-spacing:-1px;margin-bottom:0.5rem}
        .page-sub{color:var(--cinza);font-size:0.9rem;margin-bottom:2rem}
        .count-bar{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
        .count-item{background:var(--preto-card);border:1px solid #222;border-radius:12px;padding:1rem 1.5rem;text-align:center;flex:1;min-width:120px}
        .count-item .num{font-family:'Anton',sans-serif;font-size:2rem;color:var(--amarelo);line-height:1}
        .count-item .label{font-size:0.75rem;color:var(--cinza);text-transform:uppercase;letter-spacing:1px;margin-top:0.25rem}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
        .card{background:var(--preto-claro);border:1px solid #222;border-radius:10px;overflow:hidden;transition:all 0.3s;text-decoration:none;color:var(--branco);display:block}
        .card:hover{border-color:var(--amarelo);transform:translateY(-2px)}
        .card-img-wrap{width:100%;aspect-ratio:4/3;background:var(--preto-medio);overflow:hidden}
        .card-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s}
        .card:hover .card-img-wrap img{transform:scale(1.05)}
        .card-body{padding:0.75rem 1rem}
        .card-body .cat{font-size:0.6rem;color:var(--cinza);text-transform:uppercase;letter-spacing:1px;font-weight:600}
        .card-body .name{font-family:'Anton',sans-serif;font-size:0.9rem;text-transform:uppercase;color:var(--branco);margin:0.2rem 0;letter-spacing:-0.3px}
        .card-body .desc{font-size:0.75rem;color:#999;margin-bottom:0.5rem;line-height:1.4}
        .card-body .tags{display:flex;gap:0.3rem;flex-wrap:wrap}
        .card-body .tag{font-size:0.6rem;background:#222;color:var(--cinza);padding:0.15rem 0.5rem;border-radius:100px;border:1px solid #333}
        .card-body .tag.destaque{background:rgba(255,194,14,0.1);color:var(--amarelo);border-color:rgba(255,194,14,0.3)}
        .status-badge{display:inline-block;font-size:0.65rem;padding:0.15rem 0.5rem;border-radius:100px;font-weight:600;margin-top:0.4rem}
        .status-badge.catalogado{background:rgba(255,194,14,0.15);color:var(--amarelo);border:1px solid rgba(255,194,14,0.3)}
        .status-badge.info_pendente{background:rgba(140,140,140,0.15);color:var(--cinza);border:1px solid rgba(140,140,140,0.3)}
        .status-badge.roteiro{background:rgba(34,197,94,0.15);color:#22c55e;border:1px solid rgba(34,197,94,0.3)}
        .status-badge.gravado{background:rgba(59,130,246,0.15);color:#3b82f6;border:1px solid rgba(59,130,246,0.3)}
        .empty{text-align:center;padding:4rem 1rem;color:var(--cinza)}
        .empty .icon{font-size:3rem;margin-bottom:1rem;opacity:0.3}
        .footer{margin-top:3rem;padding:1.5rem 0;border-top:1px solid #222;text-align:center;font-size:0.8rem;color:var(--cinza)}
    </style>
</head>
<body>
<div class="topbar">
    <a class="back" href="../index.html">&larr; Dashboard</a>
    <span class="badge">Catalogo de Produtos</span>
</div>
<div class="container">
    <div class="page-title">Catalogo de Produtos</div>
    <div class="page-sub">Vitrine afiliada — @ocaratestou</div>

    <div class="count-bar">
        <div class="count-item"><div class="num" id="totalCount">0</div><div class="label">Produtos</div></div>
        <div class="count-item"><div class="num" id="roteiroCount">0</div><div class="label">Com Roteiro</div></div>
        <div class="count-item"><div class="num" id="gravadoCount">0</div><div class="label">Gravados</div></div>
    </div>

    <div class="grid" id="productGrid">
        <div class="empty" id="emptyState">
            <div class="icon">&#128722;</div>
            <p>Nenhum produto catalogado ainda.</p>
            <p style="font-size:0.8rem;color:#555;margin-top:0.5rem;">Os produtos aparecerao aqui conforme voce enviar os links.</p>
        </div>
    </div>

    <div class="footer">O CARA TESTOU &mdash; Catalogo vivo atualizado a cada produto</div>
</div>

<script>
var produtos = [
  {
    "id": 1,
    "slug": "cysedoya-jump-starter-compressor",
    "pasta": "cysedoya-jump-starter-compressor",
    "nome": "Cysedoya Arrancador de Bateria c/ Compressor Q18B",
    "categoria": "Automotivo",
    "descricao_curta": "Fonte de emergencia 4 em 1: jump starter 12V, compressor 150 PSI, power bank 8000mAh, lanterna SOS",
    "diferenciais": ["Jump Starter 12V", "Compressor 150 PSI", "Power Bank 8000mAh"],
    "imagem_local": "cysedoya-jump-starter-compressor/fotos/produto-001.png",
    "status": "catalogado",
    "roteiros": 8
  }
];

function render() {
    var grid = document.getElementById('productGrid');
    var empty = document.getElementById('emptyState');
    var totalEl = document.getElementById('totalCount');
    var roteiroEl = document.getElementById('roteiroCount');
    var gravadoEl = document.getElementById('gravadoCount');

    if (!produtos || produtos.length === 0) {
        empty.style.display = 'block';
        grid.querySelectorAll('.card').forEach(function(c) { c.remove(); });
        totalEl.textContent = '0';
        roteiroEl.textContent = '0';
        gravadoEl.textContent = '0';
        return;
    }

    empty.style.display = 'none';
    totalEl.textContent = produtos.length;

    var comRoteiro = 0, gravados = 0;
    produtos.forEach(function(p) {
        if (p.status === 'roteiro' || p.status === 'gravado') comRoteiro++;
        if (p.status === 'gravado') gravados++;
    });
    roteiroEl.textContent = comRoteiro;
    gravadoEl.textContent = gravados;

    var html = '';
    produtos.forEach(function(p) {
        var imgSrc = p.imagem_local || p.imagem_url || '';
        var statusClass = p.status || 'info_pendente';
        var statusLabel = p.status === 'gravado' ? 'Gravado' : (p.status === 'roteiro' ? 'Roteiro Pronto' : (p.status === 'catalogado' ? 'Catalogado' : 'Info Pendente'));

        var link = p.pasta ? p.pasta + '/produto.html' : p.slug + '.html';
        html += '<a class="card" href="' + link + '">';
        if (imgSrc) {
            html += '<div class="card-img-wrap"><img src="../../produtos/' + imgSrc + '" alt="' + p.nome + '" loading="lazy"></div>';
        } else {
            html += '<div class="card-img-wrap" style="display:flex;align-items:center;justify-content:center;color:#333;font-size:3rem;">&#128247;</div>';
        }
        html += '<div class="card-body">';
        html += '<div class="cat">' + (p.categoria || 'Geral') + '</div>';
        html += '<div class="name">' + p.nome + '</div>';
        html += '<div class="desc">' + (p.descricao_curta || '') + '</div>';
        html += '<div class="tags">';
        (p.diferenciais || []).slice(0, 3).forEach(function(d) {
            html += '<span class="tag destaque">' + d + '</span>';
        });
        html += '</div>';
        html += '<div class="status-badge ' + statusClass + '">' + statusLabel + '</div>';
        if (p.roteiros) {
            html += '<div style="margin-top:0.5rem;font-size:0.75rem;color:var(--amarelo);">&#127916; ' + p.roteiros + ' roteiros prontos</div>';
        }
        html += '</div></a>';
    });
    grid.insertAdjacentHTML('beforeend', html);
}

render();
</script>
</body>
</html>
