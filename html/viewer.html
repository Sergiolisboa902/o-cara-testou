<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O CARA TESTOU — Visualizador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;900&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --preto: #111111;
            --preto-claro: #1a1a1a;
            --preto-medio: #222222;
            --amarelo: #FFC20E;
            --cinza: #8C8C8C;
            --vermelho: #E63946;
            --branco: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--preto);
            color: var(--branco);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: 0.5;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, #0a0a0a 0%, var(--preto) 100%);
            border-bottom: 2px solid var(--amarelo);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .topbar .back {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--preto-medio);
            border: 1px solid #333;
            border-radius: 100px;
            padding: 0.4rem 1rem;
            color: var(--cinza);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .topbar .back:hover {
            border-color: var(--amarelo);
            color: var(--amarelo);
        }

        .topbar .file-name {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.75rem;
            color: var(--cinza);
        }

        .topbar .file-name span {
            color: var(--amarelo);
        }

        .topbar .badge {
            font-family: 'Anton', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: var(--amarelo);
            color: var(--preto);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* MARKDOWN RENDERED STYLES */
        #content {
            line-height: 1.8;
            font-size: 0.95rem;
        }

        #content h1 {
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            letter-spacing: -1px;
            text-transform: uppercase;
            color: var(--amarelo);
            margin: 2rem 0 0.25rem;
            line-height: 1.2;
            border-bottom: 2px solid #222;
            padding-bottom: 0.5rem;
        }

        #content h2 {
            font-family: 'Anton', sans-serif;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: var(--branco);
            margin: 2rem 0 0.5rem;
            line-height: 1.3;
        }

        #content h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--amarelo);
            margin: 1.5rem 0 0.5rem;
        }

        #content h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--cinza);
            margin: 1rem 0 0.25rem;
        }

        #content p {
            margin: 0.75rem 0;
            color: #ddd;
        }

        #content a {
            color: var(--amarelo);
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 194, 14, 0.3);
            transition: all 0.2s ease;
        }

        #content a:hover {
            border-bottom-color: var(--amarelo);
        }

        #content strong {
            color: var(--branco);
            font-weight: 700;
        }

        #content em {
            color: var(--cinza);
        }

        #content blockquote {
            border-left: 3px solid var(--amarelo);
            padding: 0.75rem 1.25rem;
            margin: 1rem 0;
            background: var(--preto-claro);
            border-radius: 0 8px 8px 0;
            color: #ccc;
            font-style: italic;
        }

        #content blockquote strong {
            color: var(--amarelo);
        }

        #content ul, #content ol {
            margin: 0.75rem 0;
            padding-left: 1.5rem;
        }

        #content li {
            margin: 0.3rem 0;
            color: #ccc;
        }

        #content li strong {
            color: var(--branco);
        }

        #content hr {
            border: none;
            border-top: 1px solid #222;
            margin: 2rem 0;
        }

        #content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.85rem;
        }

        #content th {
            background: var(--preto-medio);
            color: var(--amarelo);
            font-weight: 700;
            text-align: left;
            padding: 0.6rem 0.75rem;
            border: 1px solid #333;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #content td {
            padding: 0.5rem 0.75rem;
            border: 1px solid #222;
            color: #ccc;
        }

        #content td strong {
            color: var(--branco);
        }

        #content tr:nth-child(even) {
            background: var(--preto-claro);
        }

        #content code {
            font-family: 'Roboto Mono', monospace;
            background: var(--preto-medio);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--amarelo);
        }

        #content pre {
            background: var(--preto-claro);
            border: 1px solid #222;
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
        }

        #content pre code {
            background: none;
            padding: 0;
            color: #ddd;
        }

        #content img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #222;
            margin: 1rem 0;
        }

        /* loading / error */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            gap: 1rem;
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #222;
            border-top-color: var(--amarelo);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            color: var(--cinza);
            font-size: 0.9rem;
        }

        .error {
            text-align: center;
            padding: 4rem 1rem;
        }

        .error h2 {
            color: var(--vermelho);
            font-family: 'Anton', sans-serif;
        }

        .error p {
            color: var(--cinza);
            margin-top: 0.5rem;
        }

        .error .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--amarelo);
            text-decoration: none;
            border: 1px solid var(--amarelo);
            padding: 0.5rem 1.5rem;
            border-radius: 100px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .error .back-link:hover {
            background: var(--amarelo);
            color: var(--preto);
        }

        @media (max-width: 600px) {
            .container { padding: 1rem 1rem 3rem; }
            #content h1 { font-size: 1.5rem; }
            #content table { font-size: 0.75rem; }
            #content th, #content td { padding: 0.35rem 0.45rem; }
            .topbar .file-name { display: none; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--preto); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 100px; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <a class="back" href="index.html">&larr; Dashboard</a>
        <span class="file-name" id="filename">Carregando...</span>
    </div>
    <span class="badge">Documento</span>
</div>

<div class="container">
    <div id="content">
        <div class="loading">
            <div class="spinner"></div>
            <p>Carregando documento...</p>
        </div>
    </div>
</div>

<script>
    function getFileParam() {
        var params = new URLSearchParams(window.location.search);
        return params.get('file');
    }

    function getFileName(path) {
        var parts = path.split('/');
        return parts[parts.length - 1];
    }

    function getFolderName(path) {
        var parts = path.split('/');
        return parts.length > 1 ? parts.slice(0, -1).join('/') + '/' : '';
    }

    function fixRelativeLinks(html, basePath) {
        var parser = new DOMParser();
        var doc = parser.parseFromString(html, 'text/html');
        var links = doc.querySelectorAll('a[href]');
        links.forEach(function(link) {
            var href = link.getAttribute('href');
            if (href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('mailto')) {
                if (href.startsWith('../')) {
                    link.setAttribute('href', href.replace('../', ''));
                } else if (!href.startsWith('./')) {
                    link.setAttribute('href', basePath + href);
                }
            }
        });

        var imgs = doc.querySelectorAll('img[src]');
        imgs.forEach(function(img) {
            var src = img.getAttribute('src');
            if (src && !src.startsWith('http') && !src.startsWith('data:')) {
                if (src.startsWith('../')) {
                    img.setAttribute('src', src.replace('../', ''));
                } else if (!src.startsWith('./')) {
                    img.setAttribute('src', basePath + src);
                }
            }
        });

        return doc.body.innerHTML;
    }

    function loadFile(filePath) {
        var fileName = getFileName(filePath);
        var folder = getFolderName(filePath);
        document.getElementById('filename').innerHTML = '<span>' + folder + '</span>' + fileName;

        fetch(filePath)
            .then(function(resp) {
                if (!resp.ok) throw new Error('Erro ' + resp.status + ': ' + resp.statusText);
                return resp.text();
            })
            .then(function(text) {
                var html = marked.parse(text);
                html = fixRelativeLinks(html, folder);
                document.getElementById('content').innerHTML = html;
                document.title = fileName + ' — O CARA TESTOU';
            })
            .catch(function(err) {
                document.getElementById('content').innerHTML =
                    '<div class="error">' +
                    '<h2>Erro ao carregar</h2>' +
                    '<p>' + err.message + '</p>' +
                    '<p style="color:#555;font-size:0.8rem;margin-top:0.5rem;">' + filePath + '</p>' +
                    '<a class="back-link" href="index.html">Voltar ao Dashboard</a>' +
                    '</div>';
                document.title = 'Erro — O CARA TESTOU';
            });
    }

    var file = getFileParam();
    if (file) {
        loadFile(file);
    } else {
        document.getElementById('content').innerHTML =
            '<div class="error">' +
            '<h2>Nenhum documento especificado</h2>' +
            '<p>Use ?file=caminho/do/documento.md na URL</p>' +
            '<a class="back-link" href="index.html">Voltar ao Dashboard</a>' +
            '</div>';
    }
</script>

</body>
</html>
