<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missões — O Cara Testou</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
  .topnav {
    background: #1a1a1a; padding: .6rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topnav-brand { font-weight: 800; color: #fff; font-size: .9rem; }
  .topnav-brand span { color: #e63946; }
  .topnav-brand a { color: inherit; text-decoration: none; }
  .topnav-back {
    background: #333; border: none; padding: .4rem .9rem;
    font-size: .78rem; font-weight: 600; font-family: inherit;
    color: #ccc; cursor: pointer; border-radius: 6px; text-decoration: none;
    transition: all .2s;
  }
  .topnav-back:hover { background: #e63946; color: #fff; }
  .container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: .7rem; }
  .page-title { font-size: 1.2rem; font-weight: 800; }
  .page-title span { color: #e63946; }
  .page-title .count { font-size: .8rem; color: #999; font-weight: 600; }
  .cta-btn {
    display: inline-block; background: #e63946; color: #fff; border: none;
    font-size: .82rem; font-weight: 700; padding: .6rem 1.1rem; border-radius: 8px;
    cursor: pointer; transition: all .2s; font-family: inherit; text-decoration: none;
  }
  .cta-btn:hover { background: #c82d3a; transform: translateY(-1px); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .9rem; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

  .missao-card {
    background: #fff; border-radius: 14px; padding: 1.1rem 1.3rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); border: 2px solid transparent;
    cursor: pointer; transition: all .18s; position: relative;
  }
  .missao-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.1); transform: translateY(-2px); }
  .missao-card.completa { border-color: #3ECF8E; }
  .missao-card.andamento { border-color: #e63946; }
  .missao-head { display: flex; align-items: flex-start; justify-content: space-between; gap: .6rem; }
  .missao-nome { font-size: .92rem; font-weight: 800; line-height: 1.35; }
  .missao-sub { font-size: .72rem; color: #888; margin-top: .35rem; font-weight: 600; }
  .missao-status {
    display: inline-flex; align-items: center; gap: .35rem;
    font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: .25rem .55rem; border-radius: 20px; white-space: nowrap;
  }
  .missao-status.andamento { background: rgba(230,57,70,.12); color: #e63946; }
  .missao-status.completa { background: rgba(62,207,142,.15); color: #1a9e63; }
  .missao-progresso { font-size: .78rem; color: #888; font-weight: 700; margin-top: .7rem; margin-bottom: .4rem; }
  .missao-progresso b { color: #1a1a1a; }
  .barra { height: 6px; background: #eee; border-radius: 4px; overflow: hidden; }
  .barra-fill { height: 100%; border-radius: 4px; transition: width .3s ease; }
  .barra-fill.andamento { background: #e63946; }
  .barra-fill.completa { background: #3ECF8E; }
  .missao-data { font-size: .7rem; color: #bbb; margin-top: .6rem; }
  .missao-del {
    position: absolute; top: .6rem; right: .6rem; background: none; border: none;
    font-size: .8rem; color: #ccc; cursor: pointer; padding: .2rem .35rem; border-radius: 5px;
  }
  .missao-del:hover { color: #e63946; background: #ffe3e3; }

  .vazio {
    text-align: center; padding: 3rem; background: #fff; border-radius: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); color: #999; font-size: .9rem;
  }
  .vazio .big { font-size: 2rem; margin-bottom: .5rem; }
  .vazio a { color: #e63946; font-weight: 700; cursor: pointer; }

  /* MODAL base */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55);
    z-index: 200; align-items: center; justify-content: center; padding: 1.2rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; max-width: 640px; width: 100%;
    max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.25); animation: modalIn .2s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
  .modal-head {
    padding: 1rem 1.4rem; border-bottom: 1px solid #eee;
    display: flex; align-items: center; justify-content: space-between; gap: .8rem;
  }
  .modal-title { font-size: .95rem; font-weight: 800; }
  .modal-title span { color: #e63946; }
  .modal-sub { font-size: .74rem; color: #999; font-weight: 600; margin-top: .2rem; }
  .modal-desc {
    display: flex; align-items: flex-start; gap: .4rem;
    font-size: .8rem; color: #555; line-height: 1.45; background: #f9f9f9;
    border: 1px solid #eee; border-radius: 8px; padding: .5rem .7rem; margin-top: .5rem; max-width: 460px;
    font-weight: 400;
  }
  .modal-desc::before { content: "🎬"; flex-shrink: 0; }
  .modal-close {
    background: #eee; border: none; border-radius: 6px; cursor: pointer;
    font-size: .9rem; padding: .3rem .6rem; font-weight: 700; color: #333;
  }
  .modal-close:hover { background: #ddd; }
  .modal-body { padding: 1rem 1.4rem; overflow-y: auto; }
  .modal-footer {
    padding: .9rem 1.4rem; border-top: 1px solid #eee; display: flex; gap: .6rem; flex-wrap: wrap;
  }

  /* Detalhe missão */
  .det-contador {
    display: flex; align-items: center; gap: .6rem; font-size: .8rem; font-weight: 700; color: #555;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .det-contador .barra { flex: 1; min-width: 140px; }
  .det-contador .pct { color: #e63946; }

  .gancho-item {
    display: flex; align-items: center; gap: .7rem; padding: .55rem .1rem;
    border-bottom: 1px solid #f0f0f0;
  }
  .gancho-item:last-child { border-bottom: none; }
  .gancho-check {
    width: 20px; height: 20px; flex-shrink: 0; cursor: pointer; accent-color: #3ECF8E;
  }
  .gancho-texto { flex: 1; font-size: .85rem; line-height: 1.45; color: #333; transition: all .15s; }
  .gancho-texto.concluido { text-decoration: line-through; color: #aaa; }
  .gancho-del {
    background: none; border: none; font-size: .85rem; color: #ccc; cursor: pointer; padding: .2rem .4rem; border-radius: 5px;
  }
  .gancho-del:hover { color: #e63946; background: #ffe3e3; }
  .gancho-vazio { text-align: center; padding: 1.5rem; color: #aaa; font-size: .82rem; }

  .add-row { display: flex; gap: .5rem; width: 100%; }
  .add-row input {
    flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: .55rem .7rem;
    font-size: .85rem; font-family: inherit; outline: none;
  }
  .add-row input:focus { border-color: #e63946; }
  .add-btn {
    background: #1a1a1a; color: #fff; border: none; border-radius: 8px;
    padding: .55rem .9rem; font-size: .82rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .add-btn:hover { background: #333; }

  /* Criação */
  .form-field { margin-bottom: .9rem; }
  .form-label { display: block; font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #999; margin-bottom: .35rem; }
  .form-select, .form-textarea {
    width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: .55rem .7rem;
    font-size: .85rem; font-family: inherit; outline: none;
  }
  .form-select:focus, .form-textarea:focus { border-color: #e63946; }
  .form-textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
  .form-hint { font-size: .72rem; color: #aaa; margin-top: .3rem; }
  .m-btn {
    background: #e63946; border: none; border-radius: 8px; cursor: pointer;
    font-size: .82rem; font-weight: 700; padding: .55rem 1.1rem; color: #fff; transition: all .2s; font-family: inherit;
  }
  .m-btn:hover { background: #c82d3a; }
  .m-btn.ghost { background: #eee; color: #1a1a1a; }
  .m-btn.ghost:hover { background: #ddd; }
  .m-btn.del { background: #ffe3e3; color: #e63946; }
  .m-btn.del:hover { background: #ffd0d0; }

  .erro { text-align: center; padding: 3rem; color: #e63946; font-size: .9rem; }
  .footer { text-align: center; padding: 1.5rem; font-size: .72rem; color: #999; }
</style>
</head>
<body>
<div class="topnav">
  <div class="topnav-brand"><a href="index.html"><span>O</span> Cara Testou</a></div>
  <a href="index.html" class="topnav-back">&larr; Voltar</a>
</div>
<div class="container">
  <div class="top-bar">
    <div class="page-title"><span>Missões</span> de Produção <span class="count" id="contador"></span></div>
    <button class="cta-btn" onclick="abrirCriar()">✨ Nova Missão</button>
  </div>
  <div id="lista"></div>
</div>
<div class="footer">O Cara Testou &mdash; Missões de Produção</div>

<!-- MODAL DETALHE -->
<div class="modal-overlay" id="modal-detalhe">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="d-titulo"></div>
        <div class="modal-sub" id="d-sub"></div>
        <div class="modal-desc" id="d-descricao"></div>
      </div>
      <button class="modal-close" onclick="fecharModal('modal-detalhe')">✕</button>
    </div>
    <div class="modal-body">
      <div class="det-contador">
        <span id="d-contador"></span>
        <div class="barra"><div class="barra-fill andamento" id="d-barra"></div></div>
        <span class="pct" id="d-pct"></span>
      </div>
      <div id="d-lista"></div>
    </div>
    <div class="modal-footer">
      <div class="add-row">
        <input type="text" id="d-novo" placeholder="Adicionar novo gancho..." onkeydown="if(event.key==='Enter')adicionarGancho()">
        <button class="add-btn" onclick="adicionarGancho()">+ Adicionar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL CRIAR -->
<div class="modal-overlay" id="modal-criar">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title"><span>Nova</span> Missão</div>
      <button class="modal-close" onclick="fecharModal('modal-criar')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label class="form-label">Produto</label>
        <select class="form-select" id="c-produto"></select>
      </div>
      <div class="form-field">
        <label class="form-label">Cenário</label>
        <input type="text" class="form-select" id="c-cenario" placeholder="ex: Garagem, estúdio, mesa de trabalho...">
      </div>
      <div class="form-field">
        <label class="form-label">Figurino</label>
        <input type="text" class="form-select" id="c-figurino" placeholder="ex: Camisa preta + jaleco, regata cinza...">
      </div>
      <div class="form-field">
        <label class="form-label">Descrição da Cena</label>
        <textarea class="form-textarea" id="c-descricao" placeholder="ex: Mesa de trabalho com o produto à frente, enquadramento médio, luz natural..." style="min-height:70px"></textarea>
      </div>
      <div class="form-field">
        <label class="form-label">Ganchos (um por linha)</label>
        <textarea class="form-textarea" id="c-ganchos" placeholder="Imagina entrar no carro e ele não ligar...&#10;Você só lembra disso quando é tarde demais..."></textarea>
        <div class="form-hint">Cole quantos quiser — cada linha vira um gancho. Pode deixar vazio e adicionar depois.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="m-btn" onclick="criarMissao()">Criar missão</button>
      <button class="m-btn ghost" onclick="fecharModal('modal-criar')">Cancelar</button>
    </div>
  </div>
</div>

<div class="erro" id="erro" style="display:none"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script src="dados-produtos.js"></script>
<script>
let todasMissoes = []
let missaoAtual = null

window.onAuthReady = iniciar
getSession().then(s => { if (s) iniciar(); else injectAuthUI() })

async function iniciar() {
  const session = await getSession()
  if (!session) return
  preencherProdutos()
  await carregarMissoes()
}

function preencherProdutos() {
  const sel = document.getElementById('c-produto')
  const ultima = Object.entries(produtosDB).map(([id, p]) => ({ id, nome: p.nome }))
  if (!ultima.length) {
    sel.innerHTML = '<option value="">Nenhum produto cadastrado</option>'
    return
  }
  sel.innerHTML = ultima.map((p, i) => `<option value="${p.id}" ${i===0?'selected':''}>${p.nome}</option>`).join('')
}

// === CARREGAR MISSÕES ===
async function carregarMissoes() {
  const session = await getSession()
  if (!session) return
  const { data, error } = await _supabase
    .from('missions')
    .select('*')
    .eq('user_id', session.user.id)
    .order('criado_em', { ascending: false })
  if (error) { mostrarErro(error.message); return }
  todasMissoes = data.map(m => ({ ...m, ganchos: m.ganchos || [] }))
  renderLista()
}

function renderLista() {
  document.getElementById('contador').textContent = `(${todasMissoes.length})`
  const el = document.getElementById('lista')
  if (!todasMissoes.length) {
    el.innerHTML = `<div class="vazio"><div class="big">🎯</div>Nenhuma missão ainda.<br><br><a onclick="abrirCriar()">✨ Criar a primeira missão</a></div>`
    return
  }
  const ordenadas = [...todasMissoes].sort((a, b) => progresso(a) === progresso(b) ? 0 : (progresso(a) === 100 ? 1 : -1))
  el.innerHTML = ordenadas.map(m => {
    const [feitos, total, pct] = stats(m)
    const completa = total > 0 && feitos === total
    return `
      <div class="missao-card ${completa ? 'completa' : 'andamento'}" onclick="abrirDetalhe('${m.id}')">
        <button class="missao-del" onclick="event.stopPropagation();excluirMissao('${m.id}')" title="Excluir missão">🗑</button>
        <div class="missao-head">
          <div class="missao-nome">${m.produto}</div>
        </div>
        <div class="missao-sub">${linhaMeta(m)}</div>
        <div class="missao-status ${completa ? 'completa' : 'andamento'}">${completa ? '● Completa' : '◐ Andamento'}</div>
        <div class="missao-progresso"><b>${feitos}/${total}</b> ganchos concluídos</div>
        <div class="barra"><div class="barra-fill ${completa ? 'completa' : 'andamento'}" style="width:${pct}%"></div></div>
        <div class="missao-data">${new Date(m.criado_em).toLocaleDateString('pt-BR')}</div>
      </div>`
  }).join('')
}

function stats(m) {
  const ganchos = m.ganchos || []
  const feitos = ganchos.filter(g => g.concluido).length
  const total = ganchos.length
  const pct = total === 0 ? 0 : Math.round((feitos / total) * 100)
  return [feitos, total, pct]
}
function progresso(m) { return stats(m)[2] }
function linhaMeta(m) {
  const partes = []
  if (m.cenario) partes.push(`🎬 ${m.cenario}`)
  if (m.figurino) partes.push(`👔 ${m.figurino}`)
  return partes.join(' · ') || ''
}

// === DETALHE ===
let detalheId = null
async function abrirDetalhe(id) {
  const m = todasMissoes.find(x => x.id === id)
  if (!m) return
  detalheId = id
  missaoAtual = m
  document.getElementById('d-titulo').innerHTML = `<span>${m.produto}</span>`
  document.getElementById('d-sub').textContent = linhaMeta(m)
  const dc = document.getElementById('d-descricao')
  if (m.descricao_cena) { dc.textContent = m.descricao_cena; dc.style.display = 'flex' } else { dc.style.display = 'none' }
  document.getElementById('modal-detalhe').classList.add('open')
  renderDetalhe()
}

function renderDetalhe() {
  if (!missaoAtual) return
  const [feitos, total, pct] = stats(missaoAtual)
  const completa = total > 0 && feitos === total
  document.getElementById('d-contador').textContent = `${feitos}/${total} concluídos`
  document.getElementById('d-pct').textContent = pct + '%'
  const barra = document.getElementById('d-barra')
  barra.style.width = pct + '%'
  barra.className = 'barra-fill ' + (completa ? 'completa' : 'andamento')
  const el = document.getElementById('d-lista')
  if (!total) {
    el.innerHTML = '<div class="gancho-vazio">Nenhum gancho ainda. Adicione no campo abaixo.</div>'
    return
  }
  el.innerHTML = missaoAtual.ganchos.map((g, i) => `
    <div class="gancho-item">
      <input type="checkbox" class="gancho-check" ${g.concluido ? 'checked' : ''} onchange="toggleGancho(${i}, this.checked)">
      <span class="gancho-texto ${g.concluido ? 'concluido' : ''}">${g.texto}</span>
      <button class="gancho-del" onclick="removerGancho(${i})" title="Remover">🗑</button>
    </div>`).join('')
}

async function toggleGancho(idx, val) {
  const g = missaoAtual.ganchos[idx]
  g.concluido = val
  g.concluido_em = val ? new Date().toISOString() : null
  await persistirDetalhe()
}

async function adicionarGancho() {
  const input = document.getElementById('d-novo')
  const texto = input.value.trim()
  if (!texto) return
  missaoAtual.ganchos.push({ texto, concluido: false, concluido_em: null })
  input.value = ''
  await persistirDetalhe()
}

async function removerGancho(idx) {
  missaoAtual.ganchos.splice(idx, 1)
  await persistirDetalhe()
}

async function persistirDetalhe() {
  const session = await getSession()
  if (!session || !detalheId) return
  const { error } = await _supabase
    .from('missions')
    .update({ ganchos: missaoAtual.ganchos, atualizado_em: new Date().toISOString() })
    .eq('id', detalheId)
    .eq('user_id', session.user.id)
  if (error) { mostrarErro(error.message); return }
  renderDetalhe()
  const m = todasMissoes.find(x => x.id === detalheId)
  if (m) m.ganchos = missaoAtual.ganchos
  renderLista()
}

// === CRIAR ===
function abrirCriar() {
  document.getElementById('c-ganchos').value = ''
  document.getElementById('c-cenario').value = ''
  document.getElementById('c-figurino').value = ''
  document.getElementById('c-descricao').value = ''
  document.getElementById('modal-criar').classList.add('open')
}

async function criarMissao() {
  const produtoId = document.getElementById('c-produto').value
  const cenario = document.getElementById('c-cenario').value.trim()
  const figurino = document.getElementById('c-figurino').value.trim()
  const descricaoCena = document.getElementById('c-descricao').value.trim()
  const linhas = document.getElementById('c-ganchos').value.split('\n').map(l => l.trim()).filter(Boolean)
  const produto = produtosDB[produtoId]
  if (!produto) { alert('Selecione um produto'); return }
  const session = await getSession()
  if (!session) return
  const ganchos = linhas.map(t => ({ texto: t, concluido: false, concluido_em: null }))
  const { data, error } = await _supabase
    .from('missions')
    .insert({ user_id: session.user.id, produto: produto.nome, cenario, figurino, descricao_cena: descricaoCena, ganchos })
    .select()
    .single()
  if (error) { mostrarErro(error.message); return }
  fecharModal('modal-criar')
  await carregarMissoes()
  abrirDetalhe(data.id)
}

// === EXCLUIR ===
async function excluirMissao(id) {
  if (!confirm('Excluir esta missão?')) return
  const session = await getSession()
  if (!session) return
  const { error } = await _supabase
    .from('missions')
    .delete()
    .eq('id', id)
    .eq('user_id', session.user.id)
  if (error) { mostrarErro(error.message); return }
  await carregarMissoes()
}

// === UI HELPERS ===
function abrirModal(id) { document.getElementById(id).classList.add('open') }
function fecharModal(id) { document.getElementById(id).classList.remove('open') }
function mostrarErro(msg) { document.getElementById('erro').textContent = msg; document.getElementById('erro').style.display = 'block' }

document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open') })
})
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay').forEach(o => o.classList.remove('open')) })
</script>
<script src="fechamentos.js"></script>
<script src="fechamento-modal.js"></script>
</body>
</html>
