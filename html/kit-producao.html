<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kit de Produção — O Cara Testou</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #f9f9f9; color: #1a1a1a; }
  .topnav {
    background: #1a1a1a; padding: .6rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topnav-brand { font-weight: 800; color: #fff; font-size: .9rem; }
  .topnav-brand span { color: #e63946; }
  .topnav-brand a { color: inherit; text-decoration: none; }
  .topnav-brand a:hover { opacity: .8; }
  .topnav-back {
    background: #333; border: none; padding: .4rem .9rem;
    font-size: .78rem; font-weight: 600; font-family: inherit;
    color: #ccc; cursor: pointer; border-radius: 6px; text-decoration: none;
    transition: all .2s;
  }
  .topnav-back:hover { background: #e63946; color: #fff; }
  .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

  .card {
    background: #fff; border-radius: 14px; padding: 1.5rem 2rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 1.5rem;
  }
  .card-title {
    font-size: 1rem; font-weight: 800; margin-bottom: 1rem;
    padding-bottom: .5rem; border-bottom: 2px solid #e63946;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .card-subtitle { font-size: .75rem; color: #999; font-weight: 600; margin-bottom: .3rem; text-transform: uppercase; letter-spacing: .06em; }

  .produto-grid { display: grid; grid-template-columns: 1fr; gap: 1.2rem; }
  .info-section { margin-bottom: 1.2rem; }
  .info-section-title {
    font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
    color: #e63946; margin-bottom: .5rem; padding-bottom: .3rem; border-bottom: 1px solid #f0f0f0;
  }
  .info-section p { font-size: .85rem; color: #333; line-height: 1.6; }
  .info-section ul { padding-left: 1.2rem; }
  .info-section li { font-size: .82rem; color: #444; line-height: 1.5; margin-bottom: .25rem; }
  .objecao-card {
    background: #f9f9f9; border: 1px solid #eee; border-radius: 8px;
    padding: .7rem .9rem; margin-bottom: .5rem;
  }
  .objecao-pergunta { font-size: .82rem; font-weight: 700; color: #1a1a1a; margin-bottom: .25rem; }
  .objecao-resposta { font-size: .8rem; color: #555; line-height: 1.45; }

  .tables-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  @media (max-width: 800px) { .tables-grid { grid-template-columns: 1fr; } }

  .temas-grid { display: flex; flex-wrap: wrap; gap: .4rem; }
  .tema-chip {
    background: #f0f0f0; border: 1px solid #e0e0e0; border-radius: 6px;
    padding: .3rem .7rem; font-size: .78rem; font-weight: 600; color: #333;
  }
  .tema-chip:hover { background: #e63946; color: #fff; border-color: #e63946; }

  .table-wrap { overflow-x: auto; max-height: 500px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th { background: #1a1a1a; color: #fff; font-weight: 700; text-align: left; padding: .4rem .6rem; position: sticky; top: 0; }
  td { padding: .35rem .6rem; border-bottom: 1px solid #eee; vertical-align: top; }
  tr:hover td { background: #f5f5f5; }
  .tag {
    display: inline-block; background: #1a1a1a; color: #fff;
    font-size: .7rem; font-weight: 700; padding: .15rem .5rem; border-radius: 4px; white-space: nowrap;
  }

  .erro { text-align: center; padding: 3rem; color: #e63946; font-size: .9rem; }
  .footer { text-align: center; padding: 1.5rem; font-size: .72rem; color: #999; }
</style>
</head>
<body>
<div class="topnav">
  <div class="topnav-brand"><a href="index.html"><span>O</span> Cara Testou</a></div>
  <a href="catalogo.html" class="topnav-back">&larr; Catálogo</a>
</div>
<div class="container" id="app"></div>
<div class="footer">O Cara Testou &mdash; Kit de Produção</div>

<script src="dados-produtos.js"></script>
<script>
const params = new URLSearchParams(window.location.search)
const prodId = params.get('produto') || 'arrancador-q18b'
const prod = produtosDB[prodId]

if (!prod) {
  document.getElementById('app').innerHTML = '<div class="erro">Produto não encontrado.</div>'
} else {
  document.title = prod.nome + ' — Kit de Produção'
  const info = prod.info
  const lista = (arr) => arr.map(i => `<li>${i}</li>`).join('')
  const objecoesHTML = info.objecoes.map(o => `
    <div class="objecao-card">
      <div class="objecao-pergunta">❓ ${o.pergunta}</div>
      <div class="objecao-resposta">${o.resposta}</div>
    </div>`).join('')
  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="card-title">Informações do Produto</div>
      <p style="font-size:.82rem;color:#666;margin-bottom:1rem;">${prod.nome}</p>
      <div class="produto-grid">
        <div class="info-section">
          <div class="info-section-title">Resumo</div>
          <p>${info.resumo}</p>
        </div>
        <div class="info-section">
          <div class="info-section-title">Problemas que Resolve</div>
          <ul>${lista(info.problemas)}</ul>
        </div>
        <div class="info-section">
          <div class="info-section-title">Benefícios</div>
          <ul>${lista(info.beneficios)}</ul>
        </div>
        <div class="info-section">
          <div class="info-section-title">Características Importantes</div>
          <ul>${lista(info.caracteristicas)}</ul>
        </div>
        <div class="info-section">
          <div class="info-section-title">Diferenciais</div>
          <ul>${lista(info.diferenciais)}</ul>
        </div>
        <div class="info-section">
          <div class="info-section-title">Possíveis Testes</div>
          <ul>${lista(info.testes)}</ul>
        </div>
        <div class="info-section">
          <div class="info-section-title">Possíveis Momentos WOW</div>
          <ul>${lista(info.momentosWow)}</ul>
        </div>
        <div class="info-section">
          <div class="info-section-title">Público Ideal</div>
          <ul>${lista(info.publicoIdeal)}</ul>
        </div>
        <div class="info-section">
          <div class="info-section-title">Objeções do Comprador</div>
          ${objecoesHTML}
        </div>
        <div class="info-section">
          <div class="info-section-title">Curiosidades</div>
          <ul>${lista(info.curiosidades)}</ul>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Temas</div>
      <div class="temas-grid">${prod.temas.map(t => `<span class="tema-chip">${t}</span>`).join('')}</div>
    </div>
    <div class="tables-grid">
      <div class="card" style="margin-bottom:0;">
        <div class="card-title">Ângulos</div>
        <div class="table-wrap"><table><thead><tr><th>Ângulo</th><th>Descrição</th></tr></thead><tbody id="tabela-angulos"></tbody></table></div>
      </div>
      <div class="card" style="margin-bottom:0;">
        <div class="card-title">Ganchos</div>
        <div class="table-wrap"><table><thead><tr><th>Categoria</th><th>Gancho</th></tr></thead><tbody id="tabela-ganchos"></tbody></table></div>
      </div>
    </div>
  `
  function montar(id, dados) {
    const tbody = document.getElementById(id)
    dados.forEach(([a,b]) => {
      const tr = document.createElement('tr')
      tr.innerHTML = `<td><span class="tag">${a}</span></td><td>${b}</td>`
      tbody.appendChild(tr)
    })
  }
  montar('tabela-angulos', prod.angulos)
  montar('tabela-ganchos', prod.ganchos)
}
</script>
<script src="fechamentos.js"></script>
<script src="fechamento-modal.js"></script>
</body>
</html>
