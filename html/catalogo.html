<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — O Cara Testou</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #111; color: #fff; min-height: 100vh; }
  .topnav {
    background: #1a1a1a; padding: .6rem 2rem; border-bottom: 1px solid #222;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topnav-brand { font-weight: 800; color: #fff; font-size: .9rem; }
  .topnav-brand span { color: #e63946; }
  .topnav-brand a { color: inherit; text-decoration: none; }
  .topnav-back {
    background: #333; border: none; padding: .4rem .9rem;
    font-size: .78rem; font-weight: 600; font-family: inherit;
    color: #ccc; cursor: pointer; border-radius: 6px; text-decoration: none;
    transition: all .2s;
  }
  .topnav-back:hover { background: #e63946; color: #fff; }
  .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }
  .page-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 1.5rem; }
  .page-title span { color: #e63946; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: .7rem; }
  .cta-btn {
    display: inline-block; background: #e63946; color: #fff; text-decoration: none;
    font-size: .82rem; font-weight: 700; padding: .6rem 1.1rem; border-radius: 8px;
    transition: all .2s;
  }
  .cta-btn:hover { background: #c82d3a; transform: translateY(-1px); }
  .grid { display: grid; gap: 1rem; }

  .card {
    background: #1a1a1a; border: 1px solid #222; border-radius: 14px;
    padding: 1.5rem; text-decoration: none; color: #fff;
    display: flex; align-items: center; gap: 1rem;
    transition: all .2s;
  }
  .card:hover { background: #222; border-color: #e63946; transform: translateX(4px); }
  .card-icon { font-size: 2rem; }
  .card-body h3 { font-size: .95rem; font-weight: 700; margin-bottom: .2rem; }
  .card-body p { font-size: .78rem; color: #888; }
  .card-body .tag-count {
    display: inline-block; margin-top: .3rem;
    background: #333; color: #aaa; font-size: .7rem; font-weight: 600;
    padding: .15rem .5rem; border-radius: 4px;
  }

  .vazio { text-align: center; padding: 3rem; color: #555; font-size: .85rem; }
  .footer { text-align: center; padding: 1.5rem; font-size: .72rem; color: #444; }
</style>
</head>
<body>
<div class="topnav">
  <div class="topnav-brand"><a href="index.html"><span>O</span> Cara Testou</a></div>
  <a href="index.html" class="topnav-back">&larr; Voltar</a>
</div>
<div class="container">
  <div class="top-bar">
    <div class="page-title"><span>Catálogo</span> de Produtos</div>
    <a href="criar-roteiro.html" class="cta-btn">✨ Criar Roteiro</a>
  </div>
  <div class="grid" id="lista"></div>
</div>
<div class="footer">O Cara Testou &mdash; Catálogo</div>

<script src="dados-produtos.js"></script>
<script>
const lista = document.getElementById('lista')
const ids = Object.keys(produtosDB)
if (ids.length === 0) {
  lista.innerHTML = '<div class="vazio">Nenhum produto cadastrado ainda.</div>'
} else {
  ids.forEach(id => {
    const p = produtosDB[id]
    const totalGanchos = p.ganchos.length
    const totalAngulos = [...new Set(p.angulos.map(a => a[0]))].length
    const card = document.createElement('a')
    card.href = `kit-producao.html?produto=${id}`
    card.className = 'card'
    card.innerHTML = `
      <div class="card-icon">📦</div>
      <div class="card-body">
        <h3>${p.nome}</h3>
        <p>${totalAngulos} ângulos · ${totalGanchos} ganchos</p>
        <span class="tag-count">Ver kit →</span>
      </div>
    `
    lista.appendChild(card)
  })
}
</script>
<script src="fechamentos.js"></script>
<script src="fechamento-modal.js"></script>
</body>
</html>
